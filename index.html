const BY=Object.fromEntries(DATA.map(r=>[r[0].toUpperCase(),r]));
const KEY="hacksprint_checkins_v1";
let mem={};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return mem}}
function save(o){mem=o;try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
let ci=load();
const $=id=>document.getElementById(id);
const fmt=iso=>new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function updCount(){$("cnt").textContent=Object.keys(ci).length+" / "+DATA.length}

// tabs
const tabs={scan:"t-scan",find:"t-find",log:"t-log"};
function show(t){for(const k in tabs){$("p-"+k).classList.toggle("hide",k!==t);$(tabs[k]).classList.toggle("on",k===t)}
  if(t!=="scan")stopCam();if(t==="find")renderList();if(t==="log")renderLog()}
for(const k in tabs)$(tabs[k]).onclick=()=>show(k);

// result panel
function showRes(kind,big,name,sub,undoId){
  const r=$("res");r.className=kind;r.style.display="block";
  r.innerHTML='<div class="big">'+big+'</div>'+(name?'<div class="nm">'+esc(name)+'</div>':'')+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+
    (undoId?'<div style="margin-top:10px"><button class="btn sec sm" id="undo">Undo check-in</button></div>':'');
  if(undoId)$("undo").onclick=()=>{delete ci[undoId];save(ci);updCount();r.style.display="none"};
  if(navigator.vibrate)navigator.vibrate(kind==="ok"?60:[80,60,80]);
}
function handleId(raw){
  const id=(raw||"").trim().toUpperCase(), s=BY[id];
  if(!s){showRes("bad","✗ NOT REGISTERED","",'Scanned: '+(raw||"").slice(0,40));return}
  if(ci[s[0]]){showRes("warn","⚠ ALREADY CHECKED IN",s[1],"Entered at "+fmt(ci[s[0]])+" · "+s[0]);return}
  ci[s[0]]=new Date().toISOString();save(ci);updCount();
  showRes("ok","✓ REGISTERED",s[1],s[2]+" · "+s[0],s[0]);
}

// camera
let stream=null,raf=0,last="",lastT=0;
const vid=$("vid"),cv=$("cv"),cx=cv.getContext("2d",{willReadFrequently:true});
async function startCam(){
  $("camMsg").textContent="";
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    vid.srcObject=stream;await vid.play();vid.style.display="block";$("camBtn").textContent="Stop camera";tick();
  }catch(e){stopCam();$("camMsg").textContent="Camera not available here ("+(e.name||"error")+"). Use the Search tab instead."}
}
function stopCam(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  vid.style.display="none";$("camBtn").textContent="Start camera"}
function tick(){
  if(!stream)return;
  if(vid.readyState>=2&&window.jsQR){
    const w=480,h=Math.round(w*vid.videoHeight/vid.videoWidth)||w;cv.width=w;cv.height=h;cx.drawImage(vid,0,0,w,h);
    const c=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});
    if(c&&c.data&&(c.data!==last||Date.now()-lastT>3000)){last=c.data;lastT=Date.now();handleId(c.data)}
  }
  raf=requestAnimationFrame(tick);
}
$("camBtn").onclick=()=>stream?stopCam():startCam();

// search
function renderList(){
  const q=$("q").value.trim().toLowerCase();
  if(!q){$("list").innerHTML='<div class="muted">Type a name or ID to find a student.</div>';return}
  const hits=DATA.filter(r=>r[1].toLowerCase().includes(q)||r[0].toLowerCase().includes(q)).slice(0,30);
  if(!hits.length){$("list").innerHTML='<div class="row"><div class="n" style="color:var(--bad)">✗ No registration found</div></div>';return}
  $("list").innerHTML=hits.map(r=>'<div class="row"><div class="i"><div class="n">'+esc(r[1])+'</div><div class="s">'+esc(r[0])+' · '+esc(r[2])+'</div></div>'+
    (ci[r[0]]?'<span class="tag">IN '+fmt(ci[r[0]])+'</span>':'<button class="btn sm" data-id="'+esc(r[0])+'">Check in</button>')+'</div>').join("");
  $("list").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{ci[b.dataset.id]=new Date().toISOString();save(ci);updCount();renderList()});
}
$("q").oninput=renderList;

// log + export
function renderLog(){
  const ids=Object.keys(ci).sort((a,b)=>ci[b].localeCompare(ci[a]));
  $("logl").innerHTML=ids.length?ids.map(id=>'<div class="row"><div class="i"><div class="n">'+esc(BY[id]?BY[id][1]:id)+'</div><div class="s">'+esc(id)+'</div></div><span class="tag">'+fmt(ci[id])+'</span></div>').join(""):'<div class="muted">No check-ins yet.</div>';
}
function csv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  return "Registration ID,Name,College,Checked-in time\n"+Object.keys(ci).sort((a,b)=>ci[a].localeCompare(ci[b])).map(id=>[id,BY[id]?BY[id][1]:"",BY[id]?BY[id][2]:"",ci[id]].map(q).join(",")).join("\n");
}
$("exp").onclick=async()=>{
  const text=csv();let saved=false;
  try{const d=await claude.use("downloads");if(d){await d.save({filename:"hacksprint_checkins.csv",data:text});saved=true}}catch(e){}
  if(!saved){$("ta").classList.remove("hide");$("ta").value=text;$("ta").select();try{navigator.clipboard.writeText(text)}catch(e){}}
};
$("rst").onclick=()=>{if(confirm("Clear ALL check-ins on this device?")){ci={};save(ci);updCount();renderLog()}};
updCount();
</script></body></html>
